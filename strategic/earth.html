<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moved &rarr; /relay/</title>
<link rel="canonical" href="https://elemental.fyi/relay/earth.html">
<meta name="robots" content="noindex">
<!-- The relay moved from /strategic/ to /relay/ (strategic is one of its registers, not the
     whole of it). Handoff links already sent by email carry ?s=<session>, so the redirect must
     preserve the query string and hash — a bare meta-refresh would drop them and strand the
     relay. JS does that; the meta below is the no-JS fallback. -->
<script>location.replace("/relay/earth.html" + location.search + location.hash);</script>
<meta http-equiv="refresh" content="0; url=/relay/earth.html">
</head>
<body><p>This has moved to <a href="/relay/earth.html">elemental.fyi/relay/earth.html</a>.</p></body>
</html>
